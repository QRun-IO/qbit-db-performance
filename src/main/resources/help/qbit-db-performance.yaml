- key: process:dbPerfCollectSnapshot;slot:help
  summary: "Collect database snapshots on the host schedule."
  content: |
    Runs at the configured snapshot cadence, normally every five minutes. Reads statistics and writes interval deltas and notable activity; table/index passes normally run hourly. Requires manage settings.
- key: process:dbPerfCollectNow;slot:help
  summary: "Collect an immediate snapshot and force table and index statistics."
  content: |
    Run from the Snapshots table. Requires manage settings. The Result screen reports success, partial access or collection failure. The first pass establishes counter baselines.
- key: process:dbPerfEnableStatementStatistics;slot:help
  summary: "Turn on statement statistics where the database allows it at runtime."
  content: |
    Run from Settings. Requires manage settings. On H2 it runs SET QUERY_STATISTICS TRUE, which needs an H2 admin user and lasts until the database closes; add ;QUERY_STATISTICS=TRUE to the JDBC URL to keep it on. PostgreSQL cannot do this at runtime (pg_stat_statements needs shared_preload_libraries and CREATE EXTENSION), so the result explains the manual step. The Result screen shows the new statistics access.
- key: process:dbPerfRollupAndPurge;slot:help
  summary: "Roll up completed days and remove expired details."
  content: |
    Runs daily at 03:15 by default. Uses the configured time zone, detail retention and rollup retention. Reruns replace daily aggregates instead of duplicating them.
- key: process:dbPerfQueryPlan;slot:help
  summary: "Inspect the plan of one statement, with optional read-only execution."
  content: |
    Choose PLAN (default) or ANALYZE. PLAN uses a generic plan for parameterized SQL on PostgreSQL 16+ and H2. H2 plans are text (index choice and scan counts) without a cost tree. ANALYZE requires explain analyze permission and exactly one SELECT with no modifying CTEs, INTO or row locks. Enter parameter values only for ANALYZE, one per line in placeholder order. Values are sent transiently; they and the ANALYZE plan are never stored. Every request is audited. Results include copyable plan text, cost, a SQL Workbench link and a literal-free assistant prompt. No model is called by this qbit.
- key: widget:dbPerfSetup;slot:label
  summary: "Check backend, statistics access, collection, attribution and scheduler setup."
