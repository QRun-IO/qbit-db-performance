bundle: qbit-db-performance
version: ${project.version}
layer: QBIT
entries:
- key: app:dbPerformance;slot:help
  summary: "Find expensive queries, inspect query plans and review database capacity."
  content: |
    Start with Setup. Run {{label:dbPerfCollectNow}} from Snapshots to establish the first baseline. Two collections produce useful statement deltas. Table and index data normally refresh hourly; the dashboard refreshes every 30 to 60 seconds.
    
    Use {{label:dbPerfQueryPlan}} on a query to inspect its plan. PLAN does not execute the query; generic plans require PostgreSQL 16+. ANALYZE executes a read-only SELECT with a timeout and always rolls back. Parameters and ANALYZE plans are never stored. Raw live SQL is permission-gated and never persisted.
    
    All data lives in standard QQQ tables. The host owns scheduler registration and permissions. Attribution and findings require their corresponding runtime collectors; empty panels explain when data will arrive.
- key: table:db_perf_activity_sample;slot:help
  summary: "Notable session samples with normalized text, never raw query text."
  content: |
    The collector samples long-running, blocked and idle-in-transaction sessions every collection. Quiet databases can remain empty. Retained for detailRetentionDays (30). Use Live activity for current sessions.
- key: table:db_perf_activity_sample;slot:emptyState
