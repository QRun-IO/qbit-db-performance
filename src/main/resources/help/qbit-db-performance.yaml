- key: process:db_perf_settings.bulkEdit;slot:help
  summary: Review and apply changes to database performance settings records.
  content: |
    Requires manage settings permission. Review every changed value before applying the standard QQQ action. Changes affect subsequent collection or analysis; they do not change the monitored database schema.
